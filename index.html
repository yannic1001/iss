<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISS Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  iframe#video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: 0;
  }
  #hint {
    display: none;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    color: #9aa4b2;
    font-size: 18px;
    text-align: center;
    padding: 2rem;
  }

  /* ---- Karten-Panel unten links ---- */
  #panel {
    position: fixed;
    left: 28px;
    bottom: 28px;
    width: 360px;
    background: rgba(8, 12, 20, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    overflow: hidden;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: #dfe6ef;
    font-size: 12.5px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    z-index: 10;
  }
  #map {
    width: 360px;
    height: 200px;
    background: #0a0e16;
  }
  #info {
    padding: 10px 14px 12px;
    display: grid;
    gap: 5px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .label { color: #7f8b9c; }
  .val { font-variant-numeric: tabular-nums; }
  #status { font-weight: 600; }
  #status.day { color: #ffd479; }
  #status.night { color: #8fb3ff; }
  .leaflet-control-attribution {
    font-size: 8px !important;
    background: rgba(0, 0, 0, 0.45) !important;
    color: #6b7686 !important;
  }
  .leaflet-control-attribution a { color: #8792a3 !important; }
</style>
</head>
<body>
<div id="hint">Keine Video-ID angegeben.<br>URL so aufrufen: …/iss/?v=VIDEO-ID</div>

<div id="panel">
  <div id="map"></div>
  <div id="info">
    <div class="row"><span id="status">ISS wird gesucht …</span><span class="val" id="over"></span></div>
    <div class="row"><span class="label">Position</span><span class="val" id="pos">–</span></div>
    <div class="row"><span class="label">Höhe · Geschwindigkeit</span><span class="val" id="alt">–</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
  var params = new URLSearchParams(location.search);

  /* ================= Video ================= */
  var id = params.get("v");
  if (!id) {
    document.getElementById("hint").style.display = "flex";
  } else {
    var f = document.createElement("iframe");
    f.id = "video";
    f.src = "https://www.youtube.com/embed/" + encodeURIComponent(id) +
            "?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&modestbranding=1";
    f.allow = "autoplay; encrypted-media; picture-in-picture";
    f.referrerPolicy = "strict-origin-when-cross-origin"; // sonst YouTube-Fehler 153
    document.body.insertBefore(f, document.body.firstChild);
    setTimeout(function () { location.reload(); }, 6 * 60 * 60 * 1000);
  }

  /* ================= Karte ================= */
  // ?map=0 blendet die Karte aus
  if (params.get("map") === "0") {
    document.getElementById("panel").style.display = "none";
  } else if (window.L) {
    initMap();
  }

  function initMap() {
    var API = "https://api.wheretheiss.at/v1";
    var rad = Math.PI / 180, deg = 180 / Math.PI;

    var map = L.map("map", {
      zoomControl: false, dragging: false, scrollWheelZoom: false,
      doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false,
      zoomSnap: 0, worldCopyJump: false, attributionControl: true
    });
    map.setView([0, 0], Math.log2(360 / 256)); // ganze Welt im Panel

    // Landkarte als Vektordaten (Natural Earth, gemeinfrei) – kein Kartendienst, kein API-Key
    map.createPane("land");
    map.getPane("land").style.zIndex = 250;
    map.attributionControl.addAttribution("Natural Earth");
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
      .then(function (r) { return r.json(); })
      .then(function (topo) {
        var countries = topojson.feature(topo, topo.objects.countries);
        L.geoJSON(countries, {
          pane: "land", interactive: false,
          style: { color: "#33405a", weight: 0.5, fillColor: "#1d2638", fillOpacity: 1 }
        }).addTo(map);
      }).catch(function () {});

    var nightLayer = L.polygon([], { stroke: false, fillColor: "#000", fillOpacity: 0.45, interactive: false }).addTo(map);
    var trackLayer = L.layerGroup().addTo(map);
    var halo = L.circleMarker([0, 0], { radius: 11, stroke: false, fillColor: "#4da3ff", fillOpacity: 0.25 }).addTo(map);
    var dot  = L.circleMarker([0, 0], { radius: 4.5, color: "#fff", weight: 1.5, fillColor: "#4da3ff", fillOpacity: 1 }).addTo(map);

    var regionNames = null;
    try { regionNames = new Intl.DisplayNames(["de"], { type: "region" }); } catch (e) {}

    var $ = function (id) { return document.getElementById(id); };
    var fmt0 = function (n) { return Math.round(n).toLocaleString("de-DE"); };
    var fmtLat = function (v) { return Math.abs(v).toFixed(1) + "° " + (v >= 0 ? "N" : "S"); };
    var fmtLon = function (v) { return Math.abs(v).toFixed(1) + "° " + (v >= 0 ? "O" : "W"); };

    /* --- Tag/Nacht-Grenze (eigene Berechnung, keine Zusatzbibliothek) --- */
    function subsolarPoint(date) {
      var d = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
      var g = (357.529 + 0.98560028 * d) * rad;
      var q = 280.459 + 0.98564736 * d;
      var Ls = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
      var e = (23.439 - 0.00000036 * d) * rad;
      var ra = Math.atan2(Math.cos(e) * Math.sin(Ls), Math.cos(Ls));
      var dec = Math.asin(Math.sin(e) * Math.sin(Ls));
      var gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
      var lon = ra * deg - gmst * 15;
      lon = ((lon + 540) % 360) - 180;
      return { lat: dec * deg, lon: lon };
    }
    function updateNight() {
      var s = subsolarPoint(new Date());
      var dec = s.lat * rad;
      if (Math.abs(dec) < 1e-4) dec = 1e-4;
      var pts = [];
      for (var lon = -180; lon <= 180; lon += 2) {
        var lat = Math.atan(-Math.cos((lon - s.lon) * rad) / Math.tan(dec)) * deg;
        pts.push([lat, lon]);
      }
      var pole = s.lat > 0 ? -90 : 90; // dunkler Pol
      pts.push([pole, 180], [pole, -180]);
      nightLayer.setLatLngs(pts);
    }

    /* --- Linie in Stücke teilen, wo sie über die Datumsgrenze springt --- */
    function splitAtDateline(points) {
      var segs = [], cur = [];
      for (var i = 0; i < points.length; i++) {
        if (cur.length && Math.abs(points[i][1] - cur[cur.length - 1][1]) > 180) {
          segs.push(cur); cur = [];
        }
        cur.push(points[i]);
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /* --- Bahn: 30 min zurück, 60 min voraus --- */
    function updateTrack() {
      var now = Math.floor(Date.now() / 1000);
      var ts = [];
      for (var t = now - 1800; t <= now + 3600; t += 270) ts.push(t);
      var chunks = [];
      for (var i = 0; i < ts.length; i += 10) chunks.push(ts.slice(i, i + 10));

      Promise.all(chunks.map(function (c) {
        return fetch(API + "/satellites/25544/positions?timestamps=" + c.join(",") + "&units=kilometers")
          .then(function (r) { return r.json(); });
      })).then(function (results) {
        var all = [].concat.apply([], results).sort(function (a, b) { return a.timestamp - b.timestamp; });
        var past = [], future = [];
        all.forEach(function (p) {
          var ll = [p.latitude, p.longitude];
          if (p.timestamp <= now) past.push(ll); else future.push(ll);
        });
        if (past.length) future.unshift(past[past.length - 1]);
        trackLayer.clearLayers();
        splitAtDateline(past).forEach(function (s) {
          L.polyline(s, { color: "#4da3ff", weight: 1.5, opacity: 0.45, interactive: false }).addTo(trackLayer);
        });
        splitAtDateline(future).forEach(function (s) {
          L.polyline(s, { color: "#9cc8ff", weight: 1.5, opacity: 0.9, dashArray: "4 5", interactive: false }).addTo(trackLayer);
        });
      }).catch(function () {});
    }

    /* --- Aktuelle Position --- */
    var lastLat = 0, lastLon = 0;
    function updatePosition() {
      fetch(API + "/satellites/25544?units=kilometers")
        .then(function (r) { return r.json(); })
        .then(function (p) {
          lastLat = p.latitude; lastLon = p.longitude;
          dot.setLatLng([p.latitude, p.longitude]);
          halo.setLatLng([p.latitude, p.longitude]);
          $("pos").textContent = fmtLat(p.latitude) + " · " + fmtLon(p.longitude);
          $("alt").textContent = fmt0(p.altitude) + " km · " + fmt0(p.velocity) + " km/h";
          var st = $("status");
          if (p.visibility === "eclipsed") {
            st.textContent = "Nachtseite – Bild ist dunkel";
            st.className = "night";
          } else {
            st.textContent = "Tagseite";
            st.className = "day";
          }
        }).catch(function () {});
    }

    /* --- Über welchem Land? --- */
    function updateCountry() {
      fetch(API + "/coordinates/" + lastLat.toFixed(3) + "," + lastLon.toFixed(3))
        .then(function (r) { return r.json(); })
        .then(function (c) {
          var code = (c.country_code || "").toUpperCase();
          var name = "über dem Ozean";
          if (code && code !== "??") {
            name = "über " + ((regionNames && regionNames.of(code)) || code);
          }
          $("over").textContent = name;
        }).catch(function () { $("over").textContent = ""; });
    }

    updateNight();
    updatePosition();
    updateTrack();
    setTimeout(updateCountry, 1500);

    setInterval(updatePosition, 5000);         // alle 5 s
    setInterval(updateCountry, 30000);         // alle 30 s
    setInterval(updateNight, 5 * 60000);       // alle 5 min
    setInterval(updateTrack, 10 * 60000);      // alle 10 min
  }
</script>
</body>
</html>
